<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Downloader</title>
  </head>
  <body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Container -->
    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-2xl space-y-6 relative">

      <!-- Language Toggle -->
      <div class="absolute top-4 right-4 flex space-x-2 text-sm text-gray-500">
        <button id="lang-zh" class="hover:text-blue-600 transition font-semibold">繁體中文</button>
        <span>|</span>
        <button id="lang-en" class="hover:text-blue-600 transition font-semibold">English</button>
      </div>

      <h1 data-i18n="appTitle" class="text-3xl font-bold text-gray-800 text-center mb-6 pt-4">YouTube Downloader</h1>

      <div class="space-y-4">
        <!-- URL Input & Check -->
        <div>
          <label data-i18n="urlLabel" for="url-input" class="block text-sm font-medium text-gray-700 mb-1">YouTube URL (Video or Channel)</label>
          <div class="flex gap-2">
            <input
              type="text"
              id="url-input"
              data-i18n-placeholder="urlPlaceholder"
              placeholder="https://www.youtube.com/..."
              class="flex-1 p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
            />
            <button
              id="check-url-btn"
              data-i18n="checkUrlBtn"
              class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-md transition whitespace-nowrap"
            >
              Check URL
            </button>
          </div>
          <div id="url-info" class="hidden mt-2 p-3 bg-blue-50 border border-blue-100 rounded text-sm text-blue-800">
            <!-- Info populated by JS -->
          </div>
        </div>

        <!-- Path Input & Remember -->
        <div>
          <label data-i18n="pathLabel" for="path-input" class="block text-sm font-medium text-gray-700 mb-1">Download Path (Optional)</label>
          <input
            type="text"
            id="path-input"
            data-i18n-placeholder="pathPlaceholder"
            placeholder="Absolute path or leave empty for default"
            class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
          />
          <div class="flex items-center justify-between mt-1">
            <p data-i18n="pathHelper" class="text-xs text-gray-500">If empty, defaults to server's 'downloads' folder.</p>
            <div class="flex items-center">
              <input type="checkbox" id="remember-path-check" class="h-3 w-3 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" />
              <label data-i18n="rememberPath" for="remember-path-check" class="ml-1 text-xs text-gray-600 cursor-pointer hover:text-blue-600 transition">
                Remember Path
              </label>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Quality Select -->
          <div>
            <label data-i18n="qualityLabel" for="quality-select" class="block text-sm font-medium text-gray-700 mb-1">Quality / Format</label>
            <select
              id="quality-select"
              class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
            >
              <option data-i18n="qualityBest" value="best" selected>Best Quality (Video+Audio)</option>
              <option value="1080p">1080p</option>
              <option value="720p">720p</option>
              <option value="480p">480p</option>
              <option data-i18n="qualityAudio" value="audio">Audio Only (MP3)</option>
            </select>
          </div>

          <!-- Metadata Checkboxes -->
          <div>
            <div class="flex items-center mb-2">
              <label data-i18n="metadataLabel" class="block text-sm font-medium text-gray-700">Download Metadata</label>
              <!-- Info Icon with Tooltip -->
              <div class="relative group ml-2 flex items-center justify-center w-4 h-4 rounded-full bg-gray-200 text-gray-500 hover:bg-gray-300 cursor-help text-xs font-bold">
                ?
                <div data-i18n="metadataTooltip" class="absolute bottom-full mb-2 hidden group-hover:block w-48 p-2 bg-gray-800 text-white text-xs rounded shadow-lg z-10 text-center">
                  Extra files saved alongside your video (e.g., .vtt for subs, .webp for thumbnails, .json for description and tags).
                  <!-- Tooltip arrow -->
                  <div class="absolute top-full left-1/2 -ml-1 border-4 border-transparent border-t-gray-800"></div>
                </div>
              </div>
            </div>

            <div class="space-y-2 pl-2 border-l-2 border-gray-200">
              <div class="flex items-center">
                <input type="checkbox" id="meta-all" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" checked />
                <label id="meta-all-label" for="meta-all" class="ml-2 block text-sm text-gray-900 font-semibold cursor-pointer">Clear All</label>
              </div>
              <div class="flex items-center ml-4">
                <input type="checkbox" id="meta-subs" class="meta-sub h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" checked />
                <label data-i18n="metaSubs" for="meta-subs" class="ml-2 block text-sm text-gray-900">Subtitles (.vtt)</label>
              </div>
              <div class="flex items-center ml-4">
                <input type="checkbox" id="meta-thumb" class="meta-sub h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" checked />
                <label data-i18n="metaThumb" for="meta-thumb" class="ml-2 block text-sm text-gray-900">Thumbnail (.jpg/.webp)</label>
              </div>
              <div class="flex items-center ml-4">
                <input type="checkbox" id="meta-json" class="meta-sub h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" checked />
                <label data-i18n="metaJson" for="meta-json" class="ml-2 block text-sm text-gray-900">Info JSON (.info.json)</label>
              </div>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          id="download-btn"
          data-i18n="startDownload"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-200 ease-in-out transform hover:scale-[1.01] active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Start Download
        </button>
      </div>

      <!-- System Status -->
      <div id="system-status" class="text-xs text-center text-gray-500 mt-2" data-i18n="checkingSystem">
        Checking system dependencies...
      </div>

      <!-- Logs / Output -->
      <div class="mt-6">
        <label data-i18n="progressLogLabel" class="block text-sm font-medium text-gray-700 mb-2">Progress Log</label>
        <div
          id="log-container"
          class="bg-black text-green-400 font-mono text-xs p-4 rounded-md h-64 overflow-y-auto whitespace-pre-wrap border border-gray-800 shadow-inner"
        >
          <span data-i18n="waitingInput">Waiting for input...</span>
        </div>
      </div>
    </div>

    <!-- Footer with Github Link -->
    <div class="mt-6 text-center">
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-gray-500 hover:text-gray-800 transition">
        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" />
        </svg>
        <span data-i18n="viewSource">View Source Code</span>
      </a>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
