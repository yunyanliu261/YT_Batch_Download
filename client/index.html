<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Downloader</title>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-2xl space-y-6">
      <h1 class="text-3xl font-bold text-gray-800 text-center mb-6">YouTube Downloader</h1>

      <div class="space-y-4">
        <!-- URL Input & Check -->
        <div>
          <label for="url-input" class="block text-sm font-medium text-gray-700 mb-1">YouTube URL (Video or Channel)</label>
          <div class="flex gap-2">
            <input
              type="text"
              id="url-input"
              placeholder="https://www.youtube.com/..."
              class="flex-1 p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
            />
            <button
              id="check-url-btn"
              class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-md transition"
            >
              Check URL
            </button>
          </div>
          <div id="url-info" class="hidden mt-2 p-3 bg-blue-50 border border-blue-100 rounded text-sm text-blue-800">
            <!-- Info populated by JS -->
          </div>
        </div>

        <!-- Path Input & Remember -->
        <div>
          <label for="path-input" class="block text-sm font-medium text-gray-700 mb-1">Download Path (Optional)</label>
          <input
            type="text"
            id="path-input"
            placeholder="Absolute path or leave empty for default"
            class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
          />
          <div class="flex items-center justify-between mt-1">
            <p class="text-xs text-gray-500">If empty, defaults to server's 'downloads' folder.</p>
            <div class="flex items-center">
              <input type="checkbox" id="remember-path-check" class="h-3 w-3 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" />
              <label for="remember-path-check" class="ml-1 text-xs text-gray-600 cursor-pointer hover:text-blue-600 transition">
                Remember Path
              </label>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Quality Select -->
          <div>
            <label for="quality-select" class="block text-sm font-medium text-gray-700 mb-1">Quality / Format</label>
            <select
              id="quality-select"
              class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
            >
              <option value="best" selected>Best Quality (Video+Audio)</option>
              <option value="1080p">1080p</option>
              <option value="720p">720p</option>
              <option value="480p">480p</option>
              <option value="audio">Audio Only (MP3)</option>
            </select>
          </div>

          <!-- Metadata Checkboxes -->
          <div>
            <div class="flex items-center mb-2">
              <label class="block text-sm font-medium text-gray-700">Download Metadata</label>
              <!-- Info Icon with Tooltip -->
              <div class="relative group ml-2 flex items-center justify-center w-4 h-4 rounded-full bg-gray-200 text-gray-500 hover:bg-gray-300 cursor-help text-xs font-bold">
                ?
                <div class="absolute bottom-full mb-2 hidden group-hover:block w-48 p-2 bg-gray-800 text-white text-xs rounded shadow-lg z-10 text-center">
                  Extra files saved alongside your video (e.g., .vtt for subs, .webp for thumbnails, .json for description and tags).
                  <!-- Tooltip arrow -->
                  <div class="absolute top-full left-1/2 -ml-1 border-4 border-transparent border-t-gray-800"></div>
                </div>
              </div>
            </div>

            <div class="space-y-2 pl-2 border-l-2 border-gray-200">
              <div class="flex items-center">
                <input type="checkbox" id="meta-all" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" checked />
                <label for="meta-all" class="ml-2 block text-sm text-gray-900 font-semibold">Select All</label>
              </div>
              <div class="flex items-center ml-4">
                <input type="checkbox" id="meta-subs" class="meta-sub h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" checked />
                <label for="meta-subs" class="ml-2 block text-sm text-gray-900">Subtitles (.vtt)</label>
              </div>
              <div class="flex items-center ml-4">
                <input type="checkbox" id="meta-thumb" class="meta-sub h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" checked />
                <label for="meta-thumb" class="ml-2 block text-sm text-gray-900">Thumbnail (.jpg/.webp)</label>
              </div>
              <div class="flex items-center ml-4">
                <input type="checkbox" id="meta-json" class="meta-sub h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" checked />
                <label for="meta-json" class="ml-2 block text-sm text-gray-900">Info JSON (.info.json)</label>
              </div>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          id="download-btn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-200 ease-in-out transform hover:scale-[1.01] active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Start Download
        </button>
      </div>

      <!-- System Status -->
      <div id="system-status" class="text-xs text-center text-gray-500 mt-2">
        Checking system dependencies...
      </div>

      <!-- Logs / Output -->
      <div class="mt-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Progress Log</label>
        <div
          id="log-container"
          class="bg-black text-green-400 font-mono text-xs p-4 rounded-md h-64 overflow-y-auto whitespace-pre-wrap border border-gray-800 shadow-inner"
        >
          Waiting for input...
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
